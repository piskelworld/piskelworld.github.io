<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Piskel World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d4d6d9}
#worldScroll{width:100vw;height:100vh;height:100dvh;overflow-y:auto;overflow-x:auto;overscroll-behavior:none}
#world{position:fixed;top:0;left:0;display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair;z-index:1}
#worldHeight{height:100%;pointer-events:none;display:block}
</style>
</head>
<body>
<div id="worldScroll"><canvas id="world" aria-label="Piskel World: click to mine; touch-drag on mobile to pan; two-finger trackpad scroll on laptop"></canvas><div id="worldHeight" aria-hidden="true"></div></div>
<script src="Scripts/Spawned%20Blocks.js"></script>
<script src="Scripts/Block%20Sounds.js"></script>
<script src="Scripts/Mineable%20Blocks.js"></script>
<script src="Scripts/Block-Step Camera.js"></script>
<script src="Scripts/Background%20Music.js"></script>
</body>
</html>
